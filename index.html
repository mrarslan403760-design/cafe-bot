    <script>
      // Suppress noisy third-party browser extension errors (e.g. MetaMask inpage.js)
      window.addEventListener('error', function(e) {
        if (e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var str = String(e.reason && (e.reason.message || e.reason.stack || e.reason));
        if (str.indexOf('MetaMask') !== -1 || str.indexOf('chrome-extension://') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>

    <div id="root"></div>

  </body>
